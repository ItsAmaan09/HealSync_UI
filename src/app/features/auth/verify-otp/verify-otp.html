<div
  class="otp-wrapper min-vh-100 d-flex flex-column align-items-center justify-content-center bg-light position-relative px-3 py-5">

  <!-- Main Card -->
  <div class="otp-card container bg-white rounded-4 p-4 p-md-5 d-flex flex-column align-items-center"
    style="max-width: 480px; width: 100%; z-index: 10;">

    <!-- Icon -->
    <div
      class="text-light icon-circle bg-theme bg-opacity-10 text-theme d-flex align-items-center justify-content-center rounded-circle mb-4"
      style="width: 72px; height: 72px;">
      <span class="material-icons-outlined" style="font-size: 36px;">mark_email_read</span>
    </div>

    <!-- Title & Subtitle -->
    <h2 class="fw-bold font-heading text-dark mb-2 text-center">Verify Your Phone/Email</h2>
    <p class="text-muted small text-center mb-4 px-md-3">
      We've sent a 6-digit verification code to your registered Phone/Email. Please enter it below to confirm
      your
      identity.
    </p>

    <!-- OTP Form -->
    <form class="w-100" [formGroup]="otpForm" (ngSubmit)="onClickConfirm()">
      <div class="d-flex justify-content-between mb-4 otp-input-group" (paste)="onPaste($event)">
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 0)" (keydown)="onOtpKeydown($event, 0)" />
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 1)" (keydown)="onOtpKeydown($event, 1)" />
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 2)" (keydown)="onOtpKeydown($event, 2)" />
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 3)" (keydown)="onOtpKeydown($event, 3)" />
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 4)" (keydown)="onOtpKeydown($event, 4)" />
        <input #otpInput type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-0"
          (input)="onOtpInput($event, 5)" (keydown)="onOtpKeydown($event, 5)" />
      </div>

      <button type="submit"
        class="btn btn-theme w-100 py-3 fw-semibold d-flex align-items-center justify-content-center rounded-3">
        Verify & Proceed
        <span class="material-icons-outlined ms-2 fs-5">arrow_forward</span>
      </button>
    </form>

    <!-- Resend Link -->
    <!-- <div class="text-center mt-4">
      <span class="text-muted small">Didn't receive the code?</span>
      <a href="javascript:void(0)" class="text-decoration-none small text-theme fw-bold ms-1">Resend in 0:59</a>
    </div> -->

    <!-- Back to Login -->
    <div class="text-center mt-3">
      <a [routerLink]="['/auth/login']"
        class="text-decoration-none small text-muted d-flex align-items-center justify-content-center hover-text-theme">
        <span class="material-icons-outlined fs-6 me-1" style="font-size: 16px;">arrow_back</span> Back to Login
      </a>
    </div>
  </div>

  <!-- Decorative Blobs for premium aesthetic -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden pe-none z-0">
    <div class="blob-1 bg-theme bg-opacity-10 position-absolute rounded-circle"
      style="width: 500px; height: 500px; top: -150px; left: -100px; filter: blur(80px);"></div>
    <div class="blob-2 position-absolute rounded-circle"
      style="background-color: rgba(14, 165, 233, 0.1); width: 400px; height: 400px; bottom: 50px; right: -50px; filter: blur(80px);">
    </div>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
